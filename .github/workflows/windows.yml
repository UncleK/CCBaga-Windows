name: Windows
on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Prepare dependencies and verified browser
        run: ./scripts/windows.ps1 -Action Prepare
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Frontend and ZIP safety tests
        run: |
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p 'test_windows_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Build NSIS installer
        run: bun run tauri build --bundles nsis --features custom-protocol
      - name: Installer checksum
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content src-tauri/target/release/bundle/nsis/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CCBaga-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
